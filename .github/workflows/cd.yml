name: CD

on:
  push:
    tags: '*'

jobs:
  build-and-push:
    name: build-and-push (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
            # oks-personal's nodes are arm64 (Ampere/OKE) -- the base image's
            # multiarch lib dir differs per platform (see backend/Dockerfile).
            build-args: DEB_MULTIARCH=aarch64-linux-gnu
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      # oks-personal runs on arm64 (Ampere) nodes -- without this the image
      # builds amd64 (native to this runner) and the pod dies on start with
      # "exec format error". QEMU lets buildx cross-compile/emulate arm64
      # here (and "load" the result below for the local Trivy scan).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: image
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repo_lower}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # Build locally only (no push yet) so Trivy can scan the image before
      # anything reaches the registry.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          build-args: ${{ matrix.build-args }}
          push: false
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest

      # docker/build-push-action's own failure gives no detail beyond "exit
      # code: 1" on the public run page (full raw logs need repo-admin auth,
      # which this session doesn't have) -- re-run the same build directly
      # via the CLI so its output can be written to the step summary, which
      # IS visible on the public run page without auth.
      - name: Diagnose build failure (public log excerpt)
        if: failure()
        run: |
          build_args=()
          if [ -n "${{ matrix.build-args }}" ]; then
            build_args=(--build-arg "${{ matrix.build-args }}")
          fi
          docker buildx build --platform linux/arm64 "${build_args[@]}" \
            -f ${{ matrix.dockerfile }} ${{ matrix.context }} \
            --progress=plain > /tmp/build.log 2>&1 || true
          {
            echo "### Build failure log tail (${{ matrix.name }})"
            echo '```'
            tail -c 15000 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Gate: fails the job (and blocks the push below) if any HIGH or
      # CRITICAL severity CVE with an available fix is found. LOW/MEDIUM
      # findings and CVEs with no upstream fix yet (unfixed) are allowed,
      # since there's no action we can take on those until a fix ships.
      - name: Trivy scan (block on HIGH/CRITICAL CVEs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the exact image that was just scanned, instead of rebuilding it.
      - name: Push image
        run: |
          docker push ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          docker push ${{ steps.image.outputs.name }}:latest

  update-infra:
    name: Bump image tag in dashboard-cloud-infra
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout dashboard-cloud-infra
        uses: actions/checkout@v4
        with:
          repository: felipe-e-ribeiro/dashboard-cloud-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      # dashboard-cloud-infra consumes platform-chart as a dependency (migrated
      # from the old bespoke chart on 2026-09-13) -- image tags live nested
      # under the "platform-chart" key in values.yaml, not Chart.yaml's
      # appVersion (that key has a literal hyphen, hence the bracket path).
      - name: Bump image tags in values.yaml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          yq -i '.["platform-chart"].api.image.tag = strenv(TAG)
               | .["platform-chart"].frontend.image.tag = strenv(TAG)' values.yaml

      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values.yaml
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "chore: bump image tag to ${TAG}"
          git push
