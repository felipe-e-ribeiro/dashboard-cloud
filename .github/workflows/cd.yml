name: CD

on:
  push:
    tags: '*'

jobs:
  build-and-push:
    name: build-and-push (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: image
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repo_lower}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # Build locally only (no push yet) so Trivy can scan the image before
      # anything reaches the registry.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest

      # Gate: fails the job (and blocks the push below) if any HIGH or
      # CRITICAL severity CVE is found. LOW/MEDIUM findings are allowed.
      - name: Trivy scan (block on HIGH/CRITICAL CVEs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the exact image that was just scanned, instead of rebuilding it.
      - name: Push image
        run: |
          docker push ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          docker push ${{ steps.image.outputs.name }}:latest

  update-infra:
    name: Bump image tag in dashboard-cloud-infra
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout dashboard-cloud-infra
        uses: actions/checkout@v4
        with:
          repository: felipe-e-ribeiro/dashboard-cloud-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      # Both backend.image.tag and frontend.image.tag in values.yaml default to
      # .Chart.AppVersion, so bumping it here updates both images at once.
      - name: Bump chart appVersion
        env:
          TAG: ${{ github.ref_name }}
        run: |
          yq -i '.appVersion = strenv(TAG)' Chart.yaml

      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Chart.yaml
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "chore: bump image tag to ${TAG}"
          git push
