# 127.0.0.11 is Docker Compose's embedded DNS (used locally, see docker-compose.yml's
# "backend" service). In Kubernetes this proxy is never actually exercised -- the
# Ingress (dashboard-cloud-infra's platform-chart.ingress + templates/ingress-auth.yaml)
# routes /api and /auth straight to the api Service, bypassing this container entirely --
# but nginx still validates any `proxy_pass` target host at config-LOAD time unless it's
# a variable, and would refuse to start at all with "host not found in upstream" the
# moment "backend" doesn't resolve (confirmed: crashed the whole pod in Kubernetes).
# Using a variable defers the DNS lookup to request time instead, so startup always
# succeeds; if a request ever did reach these blocks somewhere resolver 127.0.0.11
# doesn't work, it'd just 502 that one request, not crash the container.
resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
